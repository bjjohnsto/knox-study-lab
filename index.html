<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knox's 6th Grade Study Lab</title>
<meta name="description" content="Quick soccer-themed study drills for 6th grade.">
<meta name="theme-color" content="#215C3A">

<!-- Tell browsers and phones not to hang on to an old copy of this page. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- The stylesheet is loaded with a timestamp on the end, so the browser can
     never serve a stale copy. Nothing here needs editing when you update. -->
<script>
  document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
</script>
<noscript><link rel="stylesheet" href="style.css"></noscript>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23fff' stroke='%2312241A' stroke-width='2'/><path d='M16 8l5 3.6-1.9 5.9h-6.2L11 11.6z' fill='%2312241A'/></svg>">
</head>
<body>

<header class="pitch-band">
  <div class="wrap band-inner">
    <a class="crest" href="#/">
      <span class="crest-ball" aria-hidden="true"></span>
      <span class="crest-text">
        <span class="crest-line1">Knox's 6th Grade</span>
        <span class="crest-line2">Study Lab</span>
      </span>
    </a>
    <p class="tagline">Warm up. Run the drill. Win the match.</p>
  </div>
</header>

<nav class="tabbar" aria-label="Class subjects">
  <div class="wrap tabbar-inner" id="tabbar"></div>
</nav>

<main id="app" class="wrap" tabindex="-1"></main>

<footer class="foot">
  <div class="wrap">
    <p>Every session starts fresh — nothing is saved, so play as many times as you want.</p>
  </div>
</footer>

<!-- data.js and app.js also get a timestamp, in that order. This is why you
     never have to clear a cache again after an update. -->
<script>
  (function () {
    var v = "?v=" + Date.now();
    document.write('<script src="data.js' + v + '"><\/script>');
    document.write('<script src="app.js' + v + '"><\/script>');
  })();
</script>
<noscript>
  <p style="padding:2rem;text-align:center">
    This study site needs JavaScript turned on.
  </p>
</noscript>
</body>
</html>
